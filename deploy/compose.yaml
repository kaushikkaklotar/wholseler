services:
  app:
    build:
      context: ..
    image: wholseler:local
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_STANDALONE: "true"
      WEB_PORT: "3000"
      API_PORT: "3001"
      API_INTERNAL_URL: http://127.0.0.1:3001
    # Put an HTTPS reverse proxy on this host; API 3001 is never published.
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
